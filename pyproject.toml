# uv workspace root: lets every command run from the repository root, e.g.
#   uv run python examples/basic_fake.py
#   uv run xray tail
#   uv run pytest
[tool.uv.workspace]
members = ["python"]

[tool.uv.sources]
xry4gnt = { workspace = true }

[dependency-groups]
dev = [
    "xry4gnt",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# the demo crew (examples/crew): `uv sync --group crew`
crew = [
    "langchain-groq>=1.2",
    "langchain-google-genai>=4.5",
    "ddgs>=9",
    "tavily-python>=0.8",
    "python-dotenv>=1",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["viewer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["agent_xray"]
known-local-folder = ["conftest", "basic_fake"]

[tool.ruff.lint.per-file-ignores]
# example prompts and canned text are prose
"examples/**" = ["E501"]
# the launch-video tools carry inline HTML/CSS/JS for the page overlay
"launch/**" = ["E501"]
