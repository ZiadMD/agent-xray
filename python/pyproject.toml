[project]
name = "agent-xray"
version = "0.1.0"
description = "A live, cinematic 3D view of any LangGraph app's brain. Add watch(graph) and see it think."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Agent X-Ray contributors" }]
keywords = ["langgraph", "langchain", "agents", "observability", "visualization", "3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "langgraph>=1.1",
    "langchain-core>=1.0",
    "pydantic>=2.7",
    "orjson>=3.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
xray = "agent_xray.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# the built viewer is gitignored, so it has to be listed explicitly (scripts/build.py builds it first)
[tool.hatch.build.targets.wheel]
packages = ["agent_xray"]
artifacts = ["agent_xray/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["agent_xray/static/**"]
